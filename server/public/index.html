<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Akila Com Maths Web Application">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Akila Com Maths">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Akila Com Maths</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background: linear-gradient(180deg, #FFFFFF 0%, #E8F5E9 50%, #FFFFFF 100%);
      color: #1A3026;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .loading-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
    }
    .logo-container {
      width: 120px;
      height: 120px;
      background: #ffffff;
      border-radius: 28px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0, 135, 90, 0.16), 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 1.5px solid rgba(0, 135, 90, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      animation: floatPulse 2.2s ease-in-out infinite;
    }
    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    @keyframes floatPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .app-title {
      font-size: 26px;
      font-weight: 700;
      color: #00875A;
      letter-spacing: -0.3px;
      margin-bottom: 24px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(0, 135, 90, 0.15);
      border-left-color: #00875A;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 12px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .footer-text {
      font-size: 12px;
      color: #64748B;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="loading-indicator" class="loading-container">
    <div class="logo-container">
      <img src="logo.png" alt="Akila Com Maths" />
    </div>
    <div class="app-title">Akila Com Maths</div>
    <div class="spinner"></div>
    <div id="loading-status-text" class="footer-text">Akila Jayaweera • Combined Maths</div>
  </div>
  <script>
    var isIndicatorRemoved = false;
    function removeLoadingIndicator() {
      if (isIndicatorRemoved) return;
      var el = document.getElementById('loading-indicator');
      if (el) {
        isIndicatorRemoved = true;
        el.style.opacity = '0';
        setTimeout(function() {
          if (el && el.parentNode) {
            el.parentNode.removeChild(el);
          }
        }, 400);
      }
    }

    // 1. Listen for Flutter first frame event
    window.addEventListener('flutter-first-frame', removeLoadingIndicator);

    // 2. Observer for Flutter elements mounted to DOM
    var observer = new MutationObserver(function(mutations) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        setTimeout(removeLoadingIndicator, 200);
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 3. Keep user informed during initial/debug loads so they know it is actively working
    setTimeout(function() {
      if (!isIndicatorRemoved) {
        var sub = document.getElementById('loading-status-text');
        if (sub) sub.textContent = 'Loading modules & assets...';
      }
    }, 4000);

    setTimeout(function() {
      if (!isIndicatorRemoved) {
        var sub = document.getElementById('loading-status-text');
        if (sub) sub.textContent = 'Starting application engine...';
      }
    }, 8000);

    setTimeout(function() {
      if (!isIndicatorRemoved) {
        var sub = document.getElementById('loading-status-text');
        if (sub) sub.textContent = 'Almost ready...';
      }
    }, 15000);

    // Safety fallback timeout (45s) to guarantee indicator is removed even if events fail
    setTimeout(removeLoadingIndicator, 45000);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      }).catch(function() {});
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
